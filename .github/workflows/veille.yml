name: Veille des données

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: veille
  cancel-in-progress: false

jobs:
  collecte:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dépendance (lecture du fichier EIA)
        run: pip install xlrd==2.0.1
      - name: Collecte
        run: python scripts/veille.py
      - name: Enregistrement si les données ont changé
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/veille.json
          if git diff --cached --quiet; then
            echo "Rien à enregistrer."
          else
            git commit -m "Veille : mise à jour des données"
            git push
            gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Reconstruction Pages non déclenchée (pas bloquant)."
          fi
        env:
          GH_TOKEN: ${{ github.token }}
